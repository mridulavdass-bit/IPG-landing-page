<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Verify your identity | PayGlocal</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-primary:#0061e3;
    --blue-pale:#EBF1FC;
    --blue-50:#F0F6FF;
    --gray-muted:#9C9FA8;
    --ink:#0E1A33;
    --red:#E0483F;
    --shadow-card:0 20px 50px -20px rgba(16,26,58,0.2);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:'Lato',Calibri,sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  h1,h2,h4{margin:0;font-weight:900;line-height:1.15;letter-spacing:-0.01em;}
  p{margin:0;line-height:1.6;}
  a{text-decoration:none;color:inherit;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  img{max-width:100%;display:block;}
  ul{margin:0;padding:0;list-style:none;}

  .otp-page{display:flex;min-height:100vh;}

  /* ---- LEFT: marketing panel ---- */
  .otp-left{flex:1 1 50%;position:relative;overflow:hidden;min-width:0;}
  .otp-left-img{width:100%;height:100%;object-fit:cover;object-position:center;}

  /* ---- RIGHT: OTP panel ---- */
  .otp-right{flex:1 1 50%;background:#fff;display:flex;flex-direction:column;padding:44px 64px;min-width:0;}
  .otp-back{display:inline-flex;align-items:center;gap:6px;font-size:19px;font-weight:900;color:var(--blue-primary);margin-bottom:auto;width:fit-content;}
  .otp-back:hover{opacity:.75;}
  .otp-right-inner{max-width:550px;width:100%;margin:auto;}
  .otp-right h2{font-size:19px;margin-bottom:18px;}
  .otp-sub{font-size:16.75px;color:#5B6785;font-weight:400;margin-bottom:34px;}
  .otp-sub b{color:var(--ink);}
  #resendWrap{display:block;font-family:inherit;font-size:14.75px;font-weight:400;color:#5B6785;margin-top:12px;margin-bottom:16px;}
  .resend-link{display:inline;font-family:inherit;font-size:inherit;font-weight:900;color:var(--blue-primary);background:none;border:none;padding:0;cursor:pointer;}
  .resend-count{color:var(--red);font-weight:900;}

  .otp-label{display:flex;align-items:center;gap:8px;font-size:17px;font-weight:900;color:#4A5578;margin-bottom:16px;}
  .otp-label svg{width:22px;height:22px;stroke:#4A5578;}

  .otp-inputs{display:flex;gap:16px;margin-bottom:14px;}
  .otp-inputs input{
    width:50px;height:54px;text-align:center;font-size:18px;font-weight:400;
    color:var(--ink);border:1.5px solid #E3E8F5;border-radius:12px;
    font-family:inherit;background:#F9FAFD;transition:border-color .15s ease, background .15s ease;
  }
  .otp-inputs input:focus{outline:none;border-color:var(--blue-primary);background:#fff;box-shadow:0 0 0 4px rgba(0,97,227,0.12);}
  .otp-inputs input.filled{background:#fff;border-color:var(--blue-primary);}

  .otp-error{display:none;font-size:9px;color:var(--red);font-weight:700;margin-bottom:16px;}
  .otp-error.show{display:block;}

  .btn-continue{
    width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;
    padding:14px 30px;border-radius:12px;font-weight:900;font-size:17px;color:#fff;
    background:var(--blue-primary);margin-top:14px;
    transition:transform .18s ease, box-shadow .18s ease, opacity .18s ease;
  }
  .btn-continue:hover{transform:translateY(-2px);box-shadow:0 20px 40px -18px rgba(0,97,227,0.4);}
  .btn-continue:disabled{opacity:.55;cursor:not-allowed;transform:none !important;}

  .otp-footer-links{text-align:center;font-size:11.25px;color:var(--gray-muted);font-weight:700;padding:20px 0 8px;}

  .otp-loading{display:none;text-align:center;padding:36px 0;}
  .otp-loading.show{display:block;}
  .loader-gif-full{width:66px;margin:0 auto 12px;}
  .otp-loading h4{font-size:19px;margin-bottom:6px;color:var(--ink);}
  .otp-loading p{font-size:16.75px;color:var(--gray-muted);}
  .otp-form-view.hide{display:none;}

  @media (max-width:900px){
    .otp-left{display:none;}
    .otp-right{padding:32px 24px;}
  }
</style>
</head>

<script>
/* ---- populate masked destination from what was captured on the previous step ---- */
try {
  const email = sessionStorage.getItem('pg_lead_email');
  if (email) {
    const [user, domain] = email.split('@');
    const masked = domain ? user.slice(0, 3) + '*'.repeat(Math.max(user.length - 3, 3)) + '@' + domain : email;
    document.getElementById('otpDestination').textContent = masked;
  }
} catch (e) {}

/* ---- OTP digit inputs: auto-advance, backspace, paste ---- */
const inputs = Array.from(document.querySelectorAll('#otpInputs input'));
inputs.forEach((el, i) => {
  el.addEventListener('input', () => {
    el.value = el.value.replace(/[^0-9]/g, '').slice(0, 1);
    el.classList.toggle('filled', el.value.length === 1);
    if (el.value && i < inputs.length - 1) inputs[i + 1].focus();
  });
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !el.value && i > 0) inputs[i - 1].focus();
  });
  el.addEventListener('paste', (e) => {
    e.preventDefault();
    const digits = (e.clipboardData.getData('text') || '').replace(/[^0-9]/g, '').slice(0, inputs.length).split('');
    digits.forEach((d, idx) => { if (inputs[idx]) { inputs[idx].value = d; inputs[idx].classList.add('filled'); } });
    const next = inputs[Math.min(digits.length, inputs.length - 1)];
    if (next) next.focus();
  });
});
inputs[0].focus();

/* ---- resend countdown, MM:SS ---- */
const resendTimerEl = document.getElementById('resendTimer');
const resendWrap = document.getElementById('resendWrap');
let secondsLeft = 30;
function formatTime(s){ return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
const countdown = setInterval(() => {
  secondsLeft -= 1;
  if (secondsLeft <= 0) {
    clearInterval(countdown);
    resendWrap.innerHTML = '<button type="button" class="resend-link" id="resendBtn">Resend OTP</button>';
    document.getElementById('resendBtn').addEventListener('click', startResend);
    return;
  }
  resendTimerEl.textContent = formatTime(secondsLeft);
}, 1000);

function startResend(){
  secondsLeft = 30;
  resendWrap.innerHTML = 'Resend OTP in <span class="resend-count" id="resendTimer">00:30</span> s';
  document.getElementById('otpError').classList.remove('show');
  const t = setInterval(() => {
    secondsLeft -= 1;
    const el = document.getElementById('resendTimer');
    if (secondsLeft <= 0) {
      clearInterval(t);
      resendWrap.innerHTML = '<button type="button" class="resend-link" id="resendBtn">Resend OTP</button>';
      document.getElementById('resendBtn').addEventListener('click', startResend);
      return;
    }
    if (el) el.textContent = formatTime(secondsLeft);
  }, 1000);
}

/* ---- verify: on all digits entered, show the loader then continue to the dashboard ---- */
document.getElementById('verifyBtn').addEventListener('click', () => {
  const code = inputs.map(el => el.value).join('');
  const errorEl = document.getElementById('otpError');
  if (code.length < inputs.length) {
    errorEl.textContent = 'Enter the full 4-digit code to continue.';
    errorEl.classList.add('show');
    inputs.find(el => !el.value)?.focus();
    return;
  }
  if (code !== '9812') {
    errorEl.textContent = 'Incorrect OTP. Please try again.';
    errorEl.classList.add('show');
    inputs.forEach(el => { el.value = ''; el.classList.remove('filled'); });
    inputs[0].focus();
    return;
  }
  errorEl.classList.remove('show');
  document.getElementById('otpFormView').classList.add('hide');
  document.getElementById('otpLoading').classList.add('show');
  setTimeout(() => {
    window.location.href = 'dashboard.html';
  }, 2900);
});
</script>
</body>
</html>
